# Apache vhost — Besoiu Piese Auto (LXC / Debian)
# Instalat de deploy-lxc.sh în /etc/apache2/sites-available/besoiu.conf
#
# DocumentRoot = rădăcina proiectului (index.php)

<VirtualHost *:80>
    ServerName besoiupieseauto.local
    ServerAlias *

    DocumentRoot /var/www/besoiupieseauto.ro

    <Directory /var/www/besoiupieseauto.ro>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Blochează acces HTTP direct la secrete / storage intern
    <DirectoryMatch "^/var/www/besoiupieseauto\.ro/(app/Config|app/Backend/storage|admin/storage|scripts)">
        Require all denied
    </DirectoryMatch>

    ErrorLog ${APACHE_LOG_DIR}/besoiu-error.log
    CustomLog ${APACHE_LOG_DIR}/besoiu-access.log combined
</VirtualHost>
