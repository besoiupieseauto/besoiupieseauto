; Besoiu Piese Auto — recomandări MySQL pentru Laragon (Windows)
; NU se aplică automat. Copiază manual în my.ini și repornește MySQL.
;
; Cale tipică Laragon: C:\laragon\bin\mysql\mysql-8.x.x-winx64\my.ini
; Verifică versiunea ta în Laragon → Menu → MySQL → my.ini
;
; Înainte de modificare:
;   1. php admin/tools/mysql_diagnostics.php > mysql-diagnostics.json
;   2. Notează innodb_buffer_pool_size curent și ram.buffer_pool_recommendation
;   3. Backup my.ini + snapshot BD dacă e producție

[mysqld]
; Buffer pool — ~35% RAM pe stație dev cu PHP/Apache (24 GB → ~8G)
; Pe server dedicat MySQL folosește ~65% (--dedicated în diagnostic)
innodb_buffer_pool_size=8G
innodb_buffer_pool_instances=8

; Slow query log — observație controlată (dezactivează după analiză)
slow_query_log=ON
long_query_time=1
log_output=FILE
slow_query_log_file=C:/laragon/data/mysql-slow.log

; Timeout-uri rezonabile pentru import/admin
max_execution_time=60000
wait_timeout=600
interactive_timeout=600

; InnoDB — throughput import CSV
innodb_flush_log_at_trx_commit=2
innodb_log_file_size=512M

; Opțional pe dev (NU pe producție fără evaluare)
; sync_binlog=0
